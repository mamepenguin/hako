[project]
name = "kura"
version = "0.1.0"
description = "Data store with hybrid search (FTS5 + vector)"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
kura = "kura.cli:main"
kura-web = "plugins.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kura", "plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
