[project]
name = "lifelog"
version = "0.1.0"
description = "Personal lifelog: hybrid search over your digital life"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.0",
    "numpy>=1.26.0",
    "click>=8.0.0",
]

[project.scripts]
lifelog = "lifelog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lifelog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
